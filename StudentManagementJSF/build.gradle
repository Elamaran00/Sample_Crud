plugins {
    id 'java'
    id 'war'
}

group = 'com.student.management'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    // Servlet API for Tomcat 9
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    
    // JSF 2.2 APIs and Implementation
    compileOnly 'javax.faces:javax.faces-api:2.2'
    implementation 'org.glassfish:javax.faces:2.2.20'
    
    // JPA and Hibernate (javax namespace compatible)
    implementation 'org.hibernate:hibernate-core:5.4.33.Final'
    
    // H2 Database
    implementation 'com.h2database:h2:2.2.224'
    
    // Validation
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.hibernate.validator:hibernate-validator:6.0.23.Final'

    // JSF Standard Tag Library (JSTL) if needed
    implementation 'javax.servlet:jstl:1.2'

    // Java EE Annotation API (for @PostConstruct on newer JDKs)
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // Testing
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
}

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Student Details - Student Management</title>
    <h:outputStylesheet name="css/style.css" />
</h:head>
<h:body>
    <header>
        <h1>Student Management JSF</h1>
        <nav>
            <h:form style="display:inline;">
                <h:commandLink value="Dashboard" action="dashboard?faces-redirect=true" />
                <h:commandLink value="Students" action="students?faces-redirect=true" />
                <h:commandLink value="Add Student" action="#{studentBean.prepareCreate}" />
                <h:commandLink value="Profile" action="profile?faces-redirect=true" />
                <h:commandLink value="Logout" action="#{loginBean.logout}" />
            </h:form>
        </nav>
    </header>

    <div class="container">
        <h2>Student Details</h2>
        <div style="background: white; padding: 20px; box-shadow: 0 0 5px #ccc; max-width: 800px;">
            <table class="data-table">
                <tr>
                    <th>Internal ID:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.id}" /></td>
                </tr>
                <tr>
                    <th>Student ID:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.studentId}" /></td>
                </tr>
                <tr>
                    <th>First Name:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.firstName}" /></td>
                </tr>
                <tr>
                    <th>Last Name:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.lastName}" /></td>
                </tr>
                <tr>
                    <th>Email:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.email}" /></td>
                </tr>
                <tr>
                    <th>Phone:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.phone}" /></td>
                </tr>
                <tr>
                    <th>Date of Birth:</th>
                    <td>
                        <h:outputText value="#{studentBean.currentStudent.dateOfBirth}">
                            <f:convertDateTime pattern="yyyy-MM-dd" />
                        </h:outputText>
                    </td>
                </tr>
                <tr>
                    <th>Gender:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.gender}" /></td>
                </tr>
                <tr>
                    <th>Department:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.department}" /></td>
                </tr>
                <tr>
                    <th>Course:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.course}" /></td>
                </tr>
                <tr>
                    <th>Year:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.year}" /></td>
                </tr>
                <tr>
                    <th>Status:</th>
                    <td><h:outputText value="#{studentBean.currentStudent.status}" /></td>
                </tr>
            </table>
            
            <h:form style="margin-top: 20px;">
                <h:commandButton value="Edit" action="#{studentBean.prepareEdit(studentBean.currentStudent.id)}" styleClass="btn" style="margin-right: 10px;" />
                <h:commandButton value="Delete" action="#{studentBean.deleteStudent(studentBean.currentStudent.id)}" styleClass="btn btn-danger" style="margin-right: 10px;" onclick="return confirm('Delete this student?');" />
                <h:commandButton value="Back" action="students?faces-redirect=true" styleClass="btn" />
            </h:form>
        </div>
    </div>
</h:body>
</html>

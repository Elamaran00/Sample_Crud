<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Login - Student Management</title>
    <h:outputStylesheet name="css/style.css" />
</h:head>
<h:body>
    <div class="login-container">
        <h2>Admin Login</h2>
        <h:messages globalOnly="true" class="error-msg" />
        <h:form>
            <div class="form-group">
                <h:outputLabel for="username" value="Username:" />
                <h:inputText id="username" value="#{loginBean.username}" required="true" requiredMessage="Username is required" />
                <h:message for="username" class="error-msg" />
            </div>
            <div class="form-group">
                <h:outputLabel for="password" value="Password:" />
                <h:inputSecret id="password" value="#{loginBean.password}" required="true" requiredMessage="Password is required" />
                <h:message for="password" class="error-msg" />
            </div>
            <div class="form-group">
                <h:commandButton value="Login" action="#{loginBean.login}" styleClass="btn" />
            </div>
        </h:form>
    </div>
</h:body>
</html>

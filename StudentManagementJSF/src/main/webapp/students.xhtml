<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Students - Student Management</title>
    <h:outputStylesheet name="css/style.css" />
</h:head>
<h:body>
    <header>
        <h1>Student Management JSF</h1>
        <nav>
            <h:form style="display:inline;">
                <h:commandLink value="Dashboard" action="dashboard?faces-redirect=true" />
                <h:commandLink value="Students" action="students?faces-redirect=true" />
                <h:commandLink value="Add Student" action="#{studentBean.prepareCreate}" />
                <h:commandLink value="Profile" action="profile?faces-redirect=true" />
                <h:commandLink value="Logout" action="#{loginBean.logout}" />
            </h:form>
        </nav>
    </header>

    <div class="container">
        <h2>Students List</h2>
        <h:messages globalOnly="true" class="info-msg" />
        
        <h:form id="searchForm">
            <div style="margin-bottom: 20px;">
                <h:inputText value="#{studentBean.searchQuery}" placeholder="Search Name or ID..." style="padding: 5px; width: 200px; margin-right: 10px;" />
                
                <h:selectOneMenu value="#{studentBean.filterDepartment}" style="padding: 5px; margin-right: 10px;">
                    <f:selectItem itemLabel="All Departments" itemValue="" />
                    <f:selectItem itemLabel="Computer Science" itemValue="Computer Science" />
                    <f:selectItem itemLabel="Information Technology" itemValue="Information Technology" />
                    <f:selectItem itemLabel="Mechanical Engineering" itemValue="Mechanical Engineering" />
                    <f:selectItem itemLabel="Electrical Engineering" itemValue="Electrical Engineering" />
                    <f:selectItem itemLabel="Civil Engineering" itemValue="Civil Engineering" />
                </h:selectOneMenu>
                
                <h:selectOneMenu value="#{studentBean.filterStatus}" style="padding: 5px; margin-right: 10px;">
                    <f:selectItem itemLabel="All Statuses" itemValue="" />
                    <f:selectItem itemLabel="ACTIVE" itemValue="ACTIVE" />
                    <f:selectItem itemLabel="INACTIVE" itemValue="INACTIVE" />
                    <f:selectItem itemLabel="GRADUATED" itemValue="GRADUATED" />
                </h:selectOneMenu>
                
                <h:commandButton value="Search" action="#{studentBean.search}" styleClass="btn">
                    <f:ajax execute="@form" render=":studentTableForm:studentTable" />
                </h:commandButton>
            </div>
        </h:form>
        
        <h:form id="studentTableForm">
            <h:dataTable id="studentTable" value="#{studentBean.studentsList}" var="student" styleClass="data-table">
                <h:column>
                    <f:facet name="header">Student ID</f:facet>
                    #{student.studentId}
                </h:column>
                <h:column>
                    <f:facet name="header">Name</f:facet>
                    #{student.firstName} #{student.lastName}
                </h:column>
                <h:column>
                    <f:facet name="header">Email</f:facet>
                    #{student.email}
                </h:column>
                <h:column>
                    <f:facet name="header">Department</f:facet>
                    #{student.department}
                </h:column>
                <h:column>
                    <f:facet name="header">Course</f:facet>
                    #{student.course}
                </h:column>
                <h:column>
                    <f:facet name="header">Status</f:facet>
                    #{student.status}
                </h:column>
                <h:column>
                    <f:facet name="header">Actions</f:facet>
                    <h:commandLink value="View" action="#{studentBean.viewStudent(student.id)}" style="margin-right: 10px;" />
                    <h:commandLink value="Edit" action="#{studentBean.prepareEdit(student.id)}" style="margin-right: 10px;" />
                    <h:commandLink value="Delete" action="#{studentBean.deleteStudent(student.id)}" onclick="return confirm('Are you sure you want to delete this student?');" style="color: red;" />
                </h:column>
            </h:dataTable>
        </h:form>
    </div>
</h:body>
</html>

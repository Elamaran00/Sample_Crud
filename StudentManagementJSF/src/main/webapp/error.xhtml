<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Error - Student Management</title>
    <h:outputStylesheet name="css/style.css" />
</h:head>
<h:body>
    <div class="login-container" style="width: 500px; text-align: center;">
        <h2 style="color: red;">An Error Occurred</h2>
        <p>Sorry, something went wrong while processing your request.</p>
        <h:form>
            <h:commandButton value="Return to Dashboard" action="dashboard?faces-redirect=true" styleClass="btn" />
            <h:commandButton value="Login Again" action="#{loginBean.logout}" styleClass="btn btn-danger" style="margin-left: 10px;" />
        </h:form>
    </div>
</h:body>
</html>
